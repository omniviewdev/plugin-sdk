name: wip win1 windows
on:
  push:
    branches: ['wip/win1-**']
permissions:
  contents: read
env:
  GOWORK: "off"
jobs:
  win:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: go version
        run: go version
      - name: "before the fix (the files are never closed again) the real-file tests must fail"
        continue-on-error: true
        run: |
          sed -i "s/configFile.Close()/error(nil)/; s/mdFile.Close()/error(nil)/" pkg/types/plugin.go
          git diff --stat
          go test ./pkg/types/ -run 'ClosesItsFile' -count=1 -v 2>&1 | head -80 || true
          git checkout -- pkg/types/plugin.go
      - name: "after the fix the whole package must pass"
        run: |
          git diff --stat
          go test ./pkg/types/ -count=1 -v 2>&1 | head -150
