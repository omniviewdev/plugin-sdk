syntax = "proto3";
package omniview.resource.v2;
option go_package = "github.com/omniviewdev/plugin-sdk/proto/resource/v2;resourcepb";
import "proto/resource/v2/domain.proto";
message LabelEntry { string key = 1; string value = 2; }
message ResourceMetadata { repeated LabelEntry labels = 1; TimestampValue created_at = 2; }
message WatchAddPayload { AccessRoute route = 1; Record record = 2; ResourceMetadata metadata = 3; string guarantee = 4; }
message WatchUpdatePayload { AccessRoute route = 1; Record record = 2; ResourceMetadata metadata = 3; string guarantee = 4; }
message WatchDeletePayload { AccessRoute route = 1; ResourceReference reference = 2; Record last_known = 3; string guarantee = 4; }
message WatchStateEvent { AccessRoute route = 1; string type = 2; int32 state = 3; Count count = 4; string error_code = 5; string message = 6; string guarantee = 7; }
message ResourceWatchState { string type = 1; int32 state = 2; }
message ResourceWatchCount { string type = 1; Count count = 2; }
message WatchConnectionSummary { AccessRoute route = 1; repeated ResourceWatchState resources = 2; repeated ResourceWatchCount resource_counts = 3; QueryScope scope = 4; string guarantee = 5; }
message UpdateRequest { uint32 version = 1; string operation = 2; AccessRoute route = 3; string type = 4; ReadTarget target = 5; repeated ReadTarget targets = 6; }
message OptionalWatchSummary { WatchConnectionSummary summary = 1; }
message UpdateResponse { uint32 version = 1; oneof result { bool running = 2; OptionalWatchSummary summary = 3; bool success = 4; } }
message UpdateStreamEvent { uint32 version = 1; oneof event { bool ready = 2; WatchAddPayload add = 3; WatchUpdatePayload update = 4; WatchDeletePayload delete = 5; WatchStateEvent state = 6; } }
// Advisory updates only: no atomic snapshot, replay, gap detection, or source continuity.
service ResourceUpdates { rpc Call(UpdateRequest) returns (UpdateResponse); rpc Listen(UpdateRequest) returns (stream UpdateStreamEvent); }
