syntax = "proto3";
package omniview.sdk.settings.v1;

option go_package = "github.com/omniviewdev/plugin-sdk/proto/v1/settings;settingspb";

import "google/protobuf/empty.proto";
import "google/protobuf/any.proto";

enum SettingType {
  SETTING_TYPE_TEXT = 0;
  SETTING_TYPE_SELECT = 1;
  SETTING_TYPE_MULTI_SELECT = 2;
  SETTING_TYPE_INTEGER = 3;
  SETTING_TYPE_FLOAT = 4;
  SETTING_TYPE_TOGGLE = 5;
  SETTING_TYPE_COLOR = 6;
  SETTING_TYPE_DATETIME = 7;
  SETTING_TYPE_PASSWORD = 8;
}

message SettingsCategory {
  string id = 1;
  string label = 2;
  string description = 3;
  string icon = 4;
  map<string, Setting> settings = 5;
}

message Setting {
  string id = 1;
  string label = 2;
  string description = 3;
  SettingType type = 4;
  google.protobuf.Any value = 5;
  google.protobuf.Any default = 6;
  repeated SettingOption options = 7;
  optional SettingFileSelection file_selection = 8;
  bool dev_only = 9;
  // Presence is required: absent legacy metadata is not evidence of public data.
  // Password settings remain sensitive even when a sender explicitly sends false.
  optional bool sensitive = 10;
  bool requires_restart = 11;
  bool pending_restart = 12;
}

message SettingOption {
  string label = 1;
  string description = 2;
  google.protobuf.Any value  = 3;
}

message SettingFileSelection {
  bool enabled = 1;
  bool allow_folders = 2;
  repeated string extensions = 3;
  bool multiple = 4;
  bool relative = 5;
  string default_path = 6;
}

message GetSettingRequest {
  string id = 1;
}

message GetSettingValueRequest {
  string id = 1;
}

message GetSettingValueResponse {
  google.protobuf.Any value = 1;
}

// First request proposes values; second request acknowledges durable persistence.
message CommitSettingsRequest {
  oneof phase {
    SettingsValues proposal = 1;
    bool persisted = 2;
  }
}

message SettingsValues {
  map<string, google.protobuf.Any> values = 1;
}

message CommitSettingsResponse {
  oneof phase {
    SettingsValues prepared = 1;
    CommitSettingsResult result = 2;
  }
}

message CommitSettingsResult {
  bool committed = 1;
  bool applied = 2;
  bool uncertain = 3;
}

message ListSettingsResponse {
  map<string, Setting> settings = 1;
}

message ValidateSettingRequest {
  string id = 1;
  google.protobuf.Any value = 2;
}

message ValidateSettingResponse {
  bool valid = 1;
  string code = 2;
  string message = 3;
}

// UI Configuration

// VisualComponentList is a list of all the visual components provided
// by the plugin, grouped by the section they are applicable to.
message VisualComponentList {
  repeated VisualResourceComponent resource = 1;
}

// VisualResourceComponent is a visual component that can be displayed
// in the UI within a resource.
message VisualResourceComponent {
  enum ComponentType {
    SIDEBAR = 0;
    TABLE = 1;
    TABLE_ROW = 2;
    TABLE_CELL = 3;
  }

  // The unique identifier of the component.
  string id = 1;
  // The plugin for which this component is applicable.
  string plugin = 2;
  // The type of the component.
  ComponentType type = 3;
  // The resources for which this component is applicable.
  repeated string resources = 4;
}

service SettingsPlugin {
  rpc ListSettings(google.protobuf.Empty) returns (ListSettingsResponse);
  rpc GetSetting(GetSettingRequest) returns (Setting);
  rpc GetSettingValue(GetSettingValueRequest) returns (GetSettingValueResponse);
  rpc ValidateSetting(ValidateSettingRequest) returns (ValidateSettingResponse);
  rpc CommitSettings(stream CommitSettingsRequest) returns (stream CommitSettingsResponse);
}
