syntax = "proto3";
package omniview.sdk.metric.v1;

option go_package = "github.com/omniviewdev/plugin-sdk/proto/v1/metric;metricpb";

import "google/protobuf/empty.proto";
import "proto/resource/v2/domain.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

// ===================== ENUMS ===================== //

enum MetricUnit {
  METRIC_UNIT_NONE = 0;
  METRIC_UNIT_BYTES = 1;
  METRIC_UNIT_KB = 2;
  METRIC_UNIT_MB = 3;
  METRIC_UNIT_GB = 4;
  METRIC_UNIT_PERCENTAGE = 5;
  METRIC_UNIT_MILLISECONDS = 6;
  METRIC_UNIT_SECONDS = 7;
  METRIC_UNIT_COUNT = 8;
  METRIC_UNIT_OPS_PER_SEC = 9;
  METRIC_UNIT_BYTES_PER_SEC = 10;
  METRIC_UNIT_MILLICORES = 11;
  METRIC_UNIT_CORES = 12;
}

enum MetricShape {
  METRIC_SHAPE_CURRENT = 0;
  METRIC_SHAPE_TIMESERIES = 1;
  METRIC_SHAPE_AGGREGATE = 2;
}

enum MetricStreamCommand {
  METRIC_STREAM_COMMAND_SUBSCRIBE = 0;
  METRIC_STREAM_COMMAND_UNSUBSCRIBE = 1;
  METRIC_STREAM_COMMAND_CLOSE = 2;
}

// ===================== CORE TYPES ===================== //

message MetricProviderInfo {
  string id = 1;
  string name = 2;
  string icon = 3;
  string description = 4;
}

message MetricColorRange {
  double min = 1;
  double max = 2;
  string color = 3;
}

message MetricDescriptor {
  string id = 1;
  string name = 2;
  MetricUnit unit = 3;
  string icon = 4;
  repeated MetricColorRange color_ranges = 5;
  string format_string = 6;
  repeated MetricShape supported_shapes = 7;
  string chart_group = 8;
}

message MetricHandler {
  string resource = 1;
  repeated MetricDescriptor metrics = 2;
}

// ===================== DATA TYPES ===================== //

message DataPoint {
  google.protobuf.Timestamp timestamp = 1;
  double value = 2;
  map<string, string> labels = 3;
}

message TimeSeries {
  string metric_id = 1;
  repeated DataPoint data_points = 2;
  map<string, string> labels = 3;
}

message CurrentValue {
  string metric_id = 1;
  double value = 2;
  google.protobuf.Timestamp timestamp = 3;
  map<string, string> labels = 4;
}

message AggregateValue {
  string metric_id = 1;
  double min = 2;
  double max = 3;
  double avg = 4;
  double sum = 5;
  double p50 = 6;
  double p90 = 7;
  double p99 = 8;
  int64 count = 9;
  google.protobuf.Duration window = 10;
  map<string, string> labels = 11;
}

message MetricResult {
  oneof result {
    TimeSeries time_series = 1;
    CurrentValue current_value = 2;
    AggregateValue aggregate_value = 3;
  }
}

// ===================== REQUESTS/RESPONSES ===================== //

message GetSupportedMetricResourcesResponse {
  MetricProviderInfo provider = 1;
  repeated MetricHandler handlers = 2;
}

message QueryMetricsRequest {
  string resource_key = 1;
  string resource_id = 2;
  string resource_namespace = 3;
  reserved 4;
  omniview.resource.v2.Value resource_data = 11;
  uint32 resource_wire_version = 12;
  omniview.resource.v2.ResourceReference reference = 13;
  omniview.resource.v2.AccessRoute route = 14;
  repeated string metric_ids = 5;
  MetricShape shape = 6;
  google.protobuf.Timestamp start_time = 7;
  google.protobuf.Timestamp end_time = 8;
  google.protobuf.Duration step = 9;
  map<string, string> params = 10;
}

message QueryMetricsResponse {
  bool success = 1;
  repeated MetricResult results = 2;
  string error = 3;
}

// ===================== STREAMS ===================== //

message MetricStreamInput {
  string subscription_id = 1;
  MetricStreamCommand command = 2;
  string resource_key = 3;
  string resource_id = 4;
  string resource_namespace = 5;
  reserved 6;
  omniview.resource.v2.Value resource_data = 9;
  uint32 resource_wire_version = 10;
  omniview.resource.v2.ResourceReference reference = 11;
  omniview.resource.v2.AccessRoute route = 12;
  bool resource_open = 13;
  map<string, string> params = 14;
  string catalog_revision = 15;
  repeated string metric_ids = 7;
  google.protobuf.Duration interval = 8;
}

message MetricStreamOutput {
  string subscription_id = 1;
  repeated MetricResult results = 2;
  google.protobuf.Timestamp timestamp = 3;
  string error = 4;
  MetricOperationError operation_error = 5;
}

message MetricOperationError {
  string code = 1;
  string title = 2;
  string message = 3;
  repeated string suggestions = 4;
}

message ResourceQueryMetricsResponse {
  uint32 resource_wire_version = 1;
  QueryMetricsResponse response = 2;
}

message ResourceMetricStreamOutput {
  uint32 resource_wire_version = 1;
  oneof payload {
    MetricStreamOutput output = 2;
    bool ready = 3;
  }
}

// Finite execution is independent of the legacy query/stream protocol.
message MetricSourceRef {
  string plugin_id = 1;
  string connection_id = 2;
  string datasource_uid = 3;
  string datasource_kind = 4;
  bool native = 5;
}
message FiniteMetricDescriptor {
  string id = 1;
  string name = 2;
  string resource_key = 3;
  string unit = 4;
  repeated string shapes = 5;
  string description = 6;
  MetricSourceRef source = 7;
  // Provider opt-in for coverage-aware range reuse; absent or false never
  // permits reuse. Valid only when shapes include "range". When true, every ok
  // range result is a pure point series: points are pointwise evaluations on
  // the grid start_time + n*step and, for the same context and step, their
  // value and presence do not depend on start_time, end_time or which other
  // points were requested. observed_at and window describe one requested
  // domain, not that series, so hosts reuse points across different bounds only
  // from ok results that leave both unset and whose identity_scope, source and
  // dimensions stay compatible. It implies nothing about the current shape or
  // immutable history; host cache TTL still governs staleness.
  bool range_reuse = 8;
}
// Only the host may derive these fields from admitted owner observations.
message MetricFieldBinding {
  string field = 1;
  string label = 2;
  string source = 3;
  bool required = 4;
  string transform = 5;
  string resource_path = 6;
}
message MetricDefinition {
  string id = 1;
  string name = 2;
  repeated string resource_keys = 3;
  string unit = 4;
  string semantics = 5;
  repeated string dimensions = 6;
  repeated string supported_shapes = 7;
  string query_language = 8;
  string query = 9;
  repeated MetricFieldBinding field_bindings = 10;
  repeated string identity_labels = 11;
  string reducer = 12;
  string batch_strategy = 13;
  string revision = 14;
  bool native = 15;
  // Owner declaration that this authored definition meets the guarantee on
  // FiniteMetricDescriptor.range_reuse. It is not an opt-in: the provider's
  // descriptor decides, and hosts clear it unless the effective definition is
  // exactly the owner-authored one. Valid only when supported_shapes include "range".
  bool range_reuse = 16;
}
message MetricQueryContext {
  repeated MetricDefinition definitions = 1;
  map<string,string> public_scope = 2;
  string mapping_revision = 3;
  string projection_revision = 4;
}
message ResourceMetricTarget {
  string token = 1;
  omniview.resource.v2.ResourceReference reference = 2;
  omniview.resource.v2.AccessRoute route = 3;
  map<string,string> public_data = 4;
}
message ResourceMetricsQuery {
  MetricSourceRef source = 1;
  repeated ResourceMetricTarget targets = 2;
  repeated string metric_ids = 3;
  string shape = 4;
  google.protobuf.Timestamp start_time = 5;
  google.protobuf.Timestamp end_time = 6;
  google.protobuf.Duration step = 7;
  MetricQueryContext context = 8;
}
message ResourceMetricPoint {
  google.protobuf.Timestamp time = 1;
  optional double value = 2;
}
message ResourceMetricResult {
  string resource_token = 1;
  string metric_id = 2;
  string status = 3;
  optional double value = 4;
  repeated ResourceMetricPoint points = 5;
  map<string,string> dimensions = 6;
  google.protobuf.Timestamp observed_at = 7;
  google.protobuf.Duration window = 8;
  string message = 9;
  string identity_scope = 10;
  MetricSourceRef source = 11;
}
message ResourceMetricsResponse {
  repeated ResourceMetricResult results = 1;
  bool complete = 2;
  repeated string warnings = 3;
}
message ResourceMetricsCatalog {
  MetricSourceRef source = 1;
  repeated FiniteMetricDescriptor metrics = 2;
  int32 max_targets = 3;
  // Live source-age policy; absent/zero is unknown, never a cache deadline.
  google.protobuf.Duration max_sample_age = 4;
}
message ResourceMetricsCatalogRequest {
  string resource_key = 1;
  MetricSourceRef source = 2;
  MetricQueryContext context = 3;
}
message FiniteMetricCapabilities {
  uint32 version = 1;
  bool owner_catalog = 2;
}
message MetricScopeField {
  string key = 1;
  string name = 2;
  string description = 3;
}
message MetricOwnerCatalog {
  repeated MetricDefinition definitions = 1;
  repeated MetricScopeField scope_fields = 2;
}

// ===================== SERVICE ===================== //

service MetricPlugin {
  rpc GetSupportedResources(google.protobuf.Empty) returns (GetSupportedMetricResourcesResponse);
  rpc Query(QueryMetricsRequest) returns (QueryMetricsResponse);
  rpc StreamMetrics(stream MetricStreamInput) returns (stream MetricStreamOutput);
  rpc QueryResource(QueryMetricsRequest) returns (ResourceQueryMetricsResponse);
  rpc StreamResourceMetrics(stream MetricStreamInput) returns (stream ResourceMetricStreamOutput);
  rpc GetFiniteCapabilities(google.protobuf.Empty) returns (FiniteMetricCapabilities);
  rpc GetResourceMetricsCatalog(ResourceMetricsCatalogRequest) returns (ResourceMetricsCatalog);
  rpc QueryResources(ResourceMetricsQuery) returns (ResourceMetricsResponse);
  rpc GetMetricOwnerCatalog(google.protobuf.Empty) returns (MetricOwnerCatalog);
}
